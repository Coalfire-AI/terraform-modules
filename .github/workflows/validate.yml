name: Validate

on:
  pull_request:
    branches: [main]
    paths:
      - 'modules/**'
      - '.terraform-docs.yml'

jobs:
  fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive modules/

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - agentcore_agent
          - bedrock_knowledge_base
          - chunk_metadata_transformer
          - log_retention_enforcer
          - preprocessing_lambda
          - slack_handler
          - teams_handler
          - tra_infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: modules/${{ matrix.module }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: modules/${{ matrix.module }}
        run: terraform validate

  terraform-docs:
    name: Terraform Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz https://terraform-docs.io/dl/v0.21.0/terraform-docs-v0.21.0-linux-amd64.tar.gz
          mkdir -p /tmp/terraform-docs
          tar -xzf terraform-docs.tar.gz -C /tmp/terraform-docs
          sudo mv /tmp/terraform-docs/terraform-docs /usr/local/bin/

      - name: Run terraform-docs on all modules
        run: |
          for module_dir in modules/*/; do
            echo "Checking ${module_dir}..."
            terraform-docs --lockfile=false -c .terraform-docs.yml "${module_dir}"
          done

      - name: Check for changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::terraform-docs produced changes. Run 'pre-commit run terraform-docs' locally and commit the result."
            git diff
            exit 1
          fi
