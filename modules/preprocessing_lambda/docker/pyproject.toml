# =============================================================================
# REFERENCE ONLY - Dependencies are specified directly in Dockerfile
# =============================================================================
# This file documents the Lambda's dependencies but is NOT used during
# Docker build. To update dependencies, modify the Dockerfile directly.
# =============================================================================

[project]
name = "nist-preprocessing-lambda"
version = "1.0.0"
description = "NIST Document Preprocessing Lambda with Docling"
requires-python = ">=3.11"
# NOTE: These dependencies are duplicated in docker/Dockerfile
# Keep them in sync when updating
dependencies = [
    "docling>=2.0.0,<3.0.0",
    "pymupdf>=1.24.0,<2.0.0",
    "boto3>=1.34.0,<2.0.0",
    "botocore>=1.34.0,<2.0.0",
    "python-dateutil>=2.8.0,<3.0.0",
]

# For local development only (not used in Docker build)
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
